<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참잠 — 참사랑한의원 수면 동행 노트</title>
<style>
/*
  참잠 — night-sky mood system.
  Deliberately single-theme: the subject is nighttime itself, so there is no
  light-mode variant. Background and every color are painted explicitly.
*/
:root {
  --bg: #0c0d1e;
  --surface: #171933;
  --ink: #eae7f6;
  --ink-muted: #9a97ba;
  --ink-faint: #6b6890;
  --accent: #b7b3f2;
  --accent-strong: #d9d6ff;
  --accent-tint: rgba(183, 179, 242, 0.14);
  --moon: #f0d18f;
  --moon-tint: rgba(240, 209, 143, 0.16);
  --good: #8bcdae;
  --good-tint: rgba(139, 205, 174, 0.16);
  --danger: #e8a48a;
  --danger-tint: rgba(232, 164, 138, 0.16);
  --line: #2a2c4d;
  --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.35);
  --glow-accent: 0 0 32px rgba(183, 179, 242, 0.18);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 {
  font-family: "Noto Serif KR", Georgia, "Apple SD Gothic Neo", serif;
  font-weight: 600;
  text-wrap: balance;
  color: var(--ink);
  margin: 0 0 12px;
}
p { margin: 0 0 16px; }
p:last-child { margin-bottom: 0; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
a:focus-visible, button:focus-visible, input:focus-visible, label:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
img { max-width: 100%; display: block; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
.wrap-narrow { max-width: 680px; margin: 0 auto; padding: 0 20px; }

.site-header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 880px; margin: 0 auto; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 9px;
  font-family: "Noto Serif KR", Georgia, serif; font-weight: 600; font-size: 17px;
  letter-spacing: 0.22em; color: var(--ink); text-decoration: none; flex-shrink: 0; cursor: pointer;
}
.logo svg { width: 20px; height: 20px; color: var(--moon); flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(240,209,143,0.5)); }
.site-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.site-nav a { color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
.site-nav a:hover { color: var(--ink); background: var(--surface); }
.site-nav a.active { color: var(--accent); background: var(--accent-tint); }

.site-footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 32px 0 48px; }
.footer-inner { max-width: 880px; margin: 0 auto; padding: 0 20px; }
.disclaimer-bar {
  border-left: 3px solid var(--moon); background: var(--surface); border-radius: 4px;
  padding: 12px 16px; font-size: 13px; color: var(--ink-muted); margin-bottom: 16px;
}
.disclaimer-bar strong { color: var(--ink); }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; margin-bottom: 12px; }
.footer-links a { color: var(--ink-muted); text-decoration: none; cursor: pointer; }
.footer-links a:hover { color: var(--accent); }
.copyright { font-size: 12px; color: var(--ink-faint); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 600; padding: 12px 22px; border-radius: 8px;
  border: 1px solid transparent; text-decoration: none; cursor: pointer; font-family: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #0c0d1e; }
.btn-primary:hover { background: var(--accent-strong); color: #0c0d1e; box-shadow: var(--glow-accent); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent-strong); }
.btn-block { width: 100%; }

.night-hero {
  position: relative; overflow: hidden; padding: 68px 0 0;
  background:
    radial-gradient(circle at 82% 12%, rgba(240,209,143,0.20), transparent 42%),
    linear-gradient(180deg, #0a0b19 0%, #12143a 55%, #1b1f4d 100%);
  border-bottom: 1px solid var(--line);
}
.night-hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.night-hero .hills { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: auto; z-index: 1; }
.night-hero-content { position: relative; z-index: 2; padding-bottom: 84px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: var(--moon); margin-bottom: 20px; }
.night-hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.34; color: #f5f3ff; }
.night-hero .lede { font-size: 17px; color: #c3c1e0; max-width: 52ch; margin-top: 16px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

.section { padding: 48px 0; }
.section-head { margin-bottom: 24px; max-width: 60ch; }
.section-head .kicker { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--moon); margin-bottom: 8px; }
.section-head p { color: var(--ink-muted); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px;
  box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
a.card:hover, .card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h3, .card h4 { margin-bottom: 8px; }
.card p { color: var(--ink-muted); font-size: 14px; margin-bottom: 0; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
.tag-stress { background: var(--accent-tint); color: var(--accent-strong); }
.tag-maintenance { background: var(--moon-tint); color: var(--moon); }
.tag-hygiene { background: var(--good-tint); color: var(--good); }
.tag-redflag { background: var(--danger-tint); color: var(--danger); }
.tag-neutral { background: #111227; color: var(--ink-muted); border: 1px solid var(--line); }

.quiz-progress { font-size: 13px; color: var(--ink-muted); margin-bottom: 24px; }
.quiz-question { border-bottom: 1px solid var(--line); padding: 28px 0; }
.quiz-question:first-child { padding-top: 0; }
.quiz-question .q-num { font-family: "Noto Serif KR", Georgia, serif; color: var(--moon); font-size: 14px; font-weight: 700; margin-bottom: 6px; display: block; }
.quiz-question h3 { font-size: 17px; margin-bottom: 16px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-option { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); font-size: 14.5px; }
.quiz-option:hover { border-color: var(--accent); }
.quiz-option input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.quiz-option.checked { border-color: var(--accent); background: var(--accent-tint); }
.quiz-actions { margin-top: 32px; display: flex; justify-content: center; }
.quiz-hint { text-align: center; font-size: 13px; color: var(--ink-muted); margin-top: 12px; }

.result-banner { border-radius: 14px; padding: 28px; margin-bottom: 32px; background: var(--surface); border: 1px solid var(--line); }
.result-banner.redflag { border-color: var(--danger); background: var(--danger-tint); }
.action-list { display: flex; flex-direction: column; gap: 14px; }
.action-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.action-card h4 { font-size: 15.5px; margin-bottom: 6px; }
.action-card .evidence { font-size: 12.5px; color: var(--moon); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }

.checklist { display: flex; flex-direction: column; gap: 10px; }
.check-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.check-item-row { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.check-item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
.check-item .label { font-size: 15px; font-weight: 500; }
.check-item.done .label { color: var(--ink-muted); text-decoration: line-through; }
.check-why-btn { background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 0; margin-top: 6px; font-family: inherit; }
.check-why { display: none; font-size: 13px; color: var(--ink-muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.check-why.open { display: block; }
.checklist-progress { font-size: 14px; color: var(--ink-muted); margin-bottom: 16px; }

.tool-soon { border: 1px dashed var(--line); border-radius: 12px; padding: 20px; color: var(--ink-muted); font-size: 14px; }
.tool-soon .tag { margin-bottom: 8px; }

.article-header { margin-bottom: 32px; }
.article-meta { font-size: 13px; color: var(--ink-muted); margin-top: 10px; }
.article-body h2 { font-size: 20px; margin-top: 36px; }
.article-body p { max-width: 66ch; }
.article-footnote { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-muted); }
.article-footnote strong { color: var(--ink); }
.cta-box { margin-top: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cta-box p { margin: 0; font-size: 14.5px; }

.page-eyebrow { display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--moon); }

.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.filter-chip { font-size: 13px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted); text-decoration: none; cursor: pointer; }
.filter-chip.active, .filter-chip:hover { border-color: var(--accent); color: var(--accent-strong); }

.note { border-left: 3px solid var(--moon); background: var(--surface); border-radius: 4px; padding: 14px 18px; font-size: 14px; color: var(--ink-muted); margin: 20px 0; }
.note strong { color: var(--ink); }

.breathe-stage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 40px 0 24px; min-height: 320px;
}
.breathe-ring { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
.breathe-circle {
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--accent-strong), var(--accent) 70%);
  box-shadow: 0 0 50px rgba(183,179,242,0.35);
  transform: scale(1);
  transition: transform 4000ms cubic-bezier(0.45, 0, 0.55, 1);
}
.breathe-phase { font-size: 20px; font-weight: 600; color: var(--ink); text-align: center; }
.breathe-seconds { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--moon); text-align: center; }
.breathe-count { font-size: 13px; color: var(--ink-muted); text-align: center; }
.breathe-controls { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }

.checkin-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 28px; }
.checkin-buttons { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.checkin-btn {
  flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 10px; border-radius: 10px; border: 1px solid var(--line); background: #111227;
  color: var(--ink-muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.checkin-btn .emoji { font-size: 24px; }
.checkin-btn.selected { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-strong); }
.checkin-history { display: flex; gap: 6px; margin-top: 12px; }
.checkin-dot { width: 22px; height: 22px; border-radius: 6px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-faint); }
.checkin-dot.good { background: var(--good-tint); color: var(--good); }
.checkin-dot.ok { background: var(--moon-tint); color: var(--moon); }
.checkin-dot.bad { background: var(--danger-tint); color: var(--danger); }

.checkin-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.checkin-cal-title { font-weight: 700; font-size: 14px; color: var(--ink); }
.checkin-cal-nav { background: none; border: none; color: var(--ink-muted); cursor: pointer; font-size: 18px; padding: 4px 12px; font-family: inherit; }
.checkin-cal-nav:hover { color: var(--accent); }
.checkin-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.checkin-cal-dow { text-align: center; font-size: 11px; color: var(--ink-faint); padding-bottom: 4px; }
.checkin-cal-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border-radius: 8px; border: 1px solid var(--line); background: #111227; cursor: pointer;
  font-size: 12px; color: var(--ink-muted); font-family: inherit; padding: 0;
}
.checkin-cal-day.empty { visibility: hidden; cursor: default; }
.checkin-cal-day.today { border-color: var(--moon); }
.checkin-cal-day.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.checkin-cal-day.good { background: var(--good-tint); color: var(--good); }
.checkin-cal-day.ok { background: var(--moon-tint); color: var(--moon); }
.checkin-cal-day.bad { background: var(--danger-tint); color: var(--danger); }
.checkin-cal-day .memo-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.checkin-editor { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.checkin-editor-date { font-size: 13px; color: var(--ink-muted); margin-bottom: 10px; }
.checkin-editor textarea {
  width: 100%; min-height: 70px; background: #111227; border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); padding: 10px; font-family: inherit; font-size: 13.5px; resize: vertical;
}
.checkin-save-hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }

.sound-timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; color: var(--ink-muted); }
.sound-timer-row select {
  background: #111227; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; font-family: inherit; font-size: 13px;
}
.sound-grid { display: flex; flex-direction: column; gap: 12px; }
.sound-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.sound-card.playing { border-color: var(--accent); }
.sound-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 15px; font-weight: 600; }
.sound-volume { width: 100%; accent-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .breathe-circle { transition-duration: 0.01ms !important; }
}

/* ===== 참잠 additions (환자·원장 모드) ===== */
:root { color-scheme: dark; }
.site-header { top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.site-nav { align-items: center; }
.nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--moon); color: #0c0d1e; font-size: 11px; font-weight: 700; margin-left: 5px; line-height: 1; }
.nav-logout { background: none; border: none; font-family: inherit; color: var(--ink-faint); font-size: 13px; padding: 8px 10px; cursor: pointer; border-radius: 6px; }
.nav-logout:hover { color: var(--ink); background: var(--surface); }

.today-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
@media (max-width: 760px) { .today-grid { grid-template-columns: 1fr; } }
.today-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.today-card h3 { font-size: 17px; }
.today-meta { font-size: 13px; color: var(--ink-muted); margin: 0; }
.stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.stat { flex: 1; min-width: 120px; background: #111227; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--ink-faint); display: block; }
.stat .v { font-family: "Noto Serif KR", Georgia, serif; font-size: 21px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--ink-muted); font-family: inherit; font-weight: 500; margin-left: 2px; }
.stat.warn .v { color: var(--danger); }

.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 4px; }
@media (max-width: 560px) { .field-grid { grid-template-columns: repeat(2, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-muted); }
.input { width: 100%; background: #111227; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-family: inherit; font-size: 14px; font-variant-numeric: tabular-nums; }
textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sub-label { font-size: 12.5px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.04em; margin: 18px 0 8px; display: block; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-chip { font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: #111227; color: var(--ink-muted); cursor: pointer; font-family: inherit; }
.toggle-chip.on { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-strong); }
.se-line { margin-top: 10px; font-size: 13.5px; color: var(--ink-muted); }
.se-line strong { color: var(--moon); font-variant-numeric: tabular-nums; }
.day-marks { display: flex; gap: 3px; align-items: center; height: 8px; }
.checkin-cal-day .fb-mark { font-size: 9px; line-height: 1; color: var(--moon); }
.checkin-cal-day:disabled:not(.empty) { opacity: 0.35; cursor: default; }
.doctor-note { margin-top: 16px; border-left: 3px solid var(--accent); background: var(--accent-tint); border-radius: 4px; padding: 12px 16px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.doctor-note .who { font-size: 12px; font-weight: 700; color: var(--accent-strong); display: block; margin-bottom: 4px; white-space: normal; }

.thread { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
.msg { max-width: 86%; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface); white-space: pre-wrap; word-break: break-word; }
.msg.from-doctor { align-self: flex-start; border-color: rgba(183,179,242,0.4); }
.msg.from-patient { align-self: flex-end; background: #111227; }
.msg .meta { display: block; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 4px; white-space: normal; }
.msg .meta b { color: var(--accent-strong); }
.msg.from-patient .meta b { color: var(--moon); }
.msg.unread { box-shadow: 0 0 0 1px var(--moon); }
textarea.input { min-height: 90px; resize: vertical; }
.composer-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.composer-row .today-meta { flex: 1; min-width: 200px; }

.login-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
@media (max-width: 760px) { .login-grid { grid-template-columns: 1fr; } }
.login-card { cursor: default; min-width: 0; }
.demo-list { display: flex; flex-direction: column; gap: 8px; }
.demo-pick { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: #111227; color: var(--ink); font-family: inherit; font-size: 14px; cursor: pointer; }
.demo-pick:hover { border-color: var(--accent); }

  { slug: "stimulus-control", tagClass: "tag-hygiene", tagLabel: "실천법", title: "자극조절요법: 침대는 잠잘 때만",

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5); // b - a
const md = s => { const p = s.split("-"); return `${+p[1]}/${+p[2]}`; };
const DOW = "일월화수목금토";
const dowOf = s => DOW[parseYmd(s).getDay()];
const toMin = t => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmtDur = m => `${Math.floor(m / 60)}시간 ${m % 60}분`;
const fmtDT = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const isoAt = (dateStr, hh, mm) => { const d = parseYmd(dateStr); d.setHours(hh, mm, 0, 0); return d.toISOString(); };

/* 수면효율 = 실제 수면시간 ÷ 침대에 있던 시간 × 100 */
function sleepStats(l) {
  if (!l) return null;
  const b = toMin(l.bedTime), w = toMin(l.wakeTime);
  if (b == null || w == null) return null;
  let o = toMin(l.outOfBedTime); if (o == null) o = w;
  let span = w - b; if (span <= 0) span += 1440;
  let inBed = o - b; if (inBed <= 0) inBed += 1440;
  if (inBed < span) inBed = span;
  const tst = span - (Number(l.latencyMin) || 0) - (Number(l.wakeMin) || 0);
  if (tst <= 0 || inBed <= 0) return null;
  return { tst, inBed, se: Math.min(100, Math.round(tst / inBed * 100)) };
}

/* ---------- store (저장소 어댑터: 실서비스에서는 이 부분만 서버 API로 교체) ---------- */
const STORE_KEY = "chamjam_store_v1";
const SESSION_KEY = "chamjam_session_v1";
let DB = null;

function emptyLog() {
  return { mood: null, memo: "", bedTime: "", latencyMin: "", wakeCount: "", wakeMin: "", wakeTime: "", outOfBedTime: "", herb: { am: false, pm: false }, symptoms: [], checklist: {}, breaths: 0 };
}
function normalizeLog(v) {
  if (v == null) return null;
  if (typeof v === "string") return { ...emptyLog(), mood: v }; // 예전 문자열 값 호환
  const base = emptyLog();
  return { ...base, ...v, herb: { ...base.herb, ...(v.herb || {}) }, symptoms: Array.isArray(v.symptoms) ? v.symptoms : [], checklist: v.checklist || {} };
}
function hasContent(l) { return !!(l && (l.mood || l.bedTime || (l.memo && l.memo.trim()))); }

function loadDB() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { d = null; }
  if (!d || !Array.isArray(d.patients)) { DB = seedDB(); ensureSchema(); migrateLegacy(); saveDB(); }
  else {
    DB = d;
    ensureSchema();
    const p1 = DB.patients.find(p => p.id === "p1");
    if (p1 && p1.code !== "000000" && !DB.patients.some(p => p.code === "000000")) { p1.code = "000000"; saveDB(); }
  }
}
function saveDB() { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {} }
function resetDB() { DB = seedDB(); ensureSchema(); saveDB(); }

function migrateLegacy() {
  // 원본 '굿나잇' 체크인 기록이 이 브라우저에 있으면 첫 데모 환자에게 1회 이관
  try {
    const raw = localStorage.getItem("goodnight_checkin_v1");
    if (!raw) return;
    const old = JSON.parse(raw) || {};
    const L = DB.logs.p1 || (DB.logs.p1 = {});
    Object.keys(old).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !L[k]) { const v = normalizeLog(old[k]); if (v) L[k] = v; } });
  } catch (e) {}
}

const Store = {
  patients: () => DB.patients,
  patient: id => DB.patients.find(p => p.id === id),
  logsOf(pid) { return DB.logs[pid] || (DB.logs[pid] = {}); },
  getLog(pid, date) { return normalizeLog((DB.logs[pid] || {})[date]); },
  updateLog(pid, date, patch) {
    const L = Store.logsOf(pid);
    const cur = normalizeLog(L[date]) || emptyLog();
    L[date] = { ...cur, ...patch, updatedAt: new Date().toISOString() };
    saveDB(); return L[date];
  },
  messages(pid) { return DB.feedback.filter(f => f.patientId === pid).sort((a, b) => a.createdAt < b.createdAt ? -1 : 1); },
  addMessage(m) { DB.feedback.push({ id: uid(), date: null, readAt: null, createdAt: new Date().toISOString(), ...m }); saveDB(); },
  markRead(pid, from) {
    let ch = false;
    DB.feedback.forEach(f => { if (f.patientId === pid && f.from === from && !f.readAt) { f.readAt = new Date().toISOString(); ch = true; } });
    if (ch) saveDB();
  },
  unread(pid, from) { return DB.feedback.filter(f => f.patientId === pid && f.from === from && !f.readAt).length; },
  assessmentsOf(pid) { return DB.assessments.filter(a => a.patientId === pid).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1); },
  addAssessment(a) { DB.assessments.push({ id: uid(), createdAt: new Date().toISOString(), ...a }); saveDB(); },
  updatePatient(id, patch) { const p = Store.patient(id); if (p) { Object.assign(p, patch); saveDB(); } },
  addPatient(name, note) {
    let code; do { code = String(100000 + Math.floor(Math.random() * 900000)); } while (DB.patients.some(p => p.code === code));
    const p = { id: "p" + uid(), name, code, note: note || "", startDate: todayStr(), nextVisit: addDays(todayStr(), 14), assignedTasks: [] };
    DB.patients.push(p); saveDB(); return p;
  },
  templates: () => DB.templates,
  addTemplate(text) { DB.templates.push({ id: uid(), text }); saveDB(); },
  removeTemplate(id) { DB.templates = DB.templates.filter(t => t.id !== id); saveDB(); }
};

/* ---------- 데모 데이터 (가상 환자 3명 · 14일) ---------- */
function seedDB() {
  const t = todayStr();
  const day = k => addDays(t, k - 13); // k=0 → 13일 전, k=13 → 오늘
  const patients = [
    { id: "p1", name: "김민지", code: "000000", note: "입면장애 · 한약 복용 중", startDate: addDays(t, -20), nextVisit: addDays(t, 5), assignedTasks: ["caffeine-cutoff", "bed-only-sleepy", "twenty-minute-rule"] },

  const bed1 = ["00:40", "00:30", "00:20", "00:50", "00:10", "23:50", "00:30", "23:50", "23:40", "23:30", "23:40", "23:30", "23:20"];

  const wm1 = [30, 20, 15, 40, 15, 10, 30, 15, 10, 0, 10, 0, 0];
  const memo1 = { 0: "회의 걱정 때문에 계속 뒤척임", 3: "야근 후 바로 누움. 커피 오후 4시에 마심", 6: "저녁을 늦게 먹어서 속이 더부룩", 9: "20분 규칙 해봄. 금방 잠듦", 12: "기상 시간 지킴. 아침이 덜 피곤함" };

  const bed2 = ["01:00", "01:10", "01:40", "00:50", "01:00", "00:40", "01:20", "01:10", "02:00", "01:00", "01:30", "01:50", "02:10", "01:40"];

/* ---------- 지표 ---------- */
function avgSE(pid, days) {
  const t = todayStr(); const L = DB.logs[pid] || {}; const vals = [];
  for (let i = 0; i < days; i++) { const s = sleepStats(normalizeLog(L[addDays(t, -i)])); if (s) vals.push(s.se); }
  return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
}
function lastLogDate(pid) {
  const L = DB.logs[pid] || {};
  return Object.keys(L).filter(d => hasContent(normalizeLog(L[d]))).sort().at(-1) || null;
}
function patientFlags(p) {
  const t = todayStr(); const L = DB.logs[p.id] || {}; const flags = [];
  const last = lastLogDate(p.id);
  const gap = last ? diffDays(last, t) : null;
  if (gap == null) flags.push({ cls: "tag-redflag", label: "기록 없음", w: 2 });
  else if (gap >= 3) flags.push({ cls: "tag-redflag", label: `${gap}일째 미기록`, w: 2 });
  const tl = normalizeLog(L[t]);
  const end = tl && tl.mood ? t : addDays(t, -1);
  if ([0, 1, 2].every(i => { const x = normalizeLog(L[addDays(end, -i)]); return x && x.mood === "bad"; })) flags.push({ cls: "tag-redflag", label: "3일 연속 나쁨", w: 3 });
  const msgs = Store.messages(p.id); const lm = msgs.at(-1);
  if (lm && lm.from === "patient") flags.push({ cls: "tag-stress", label: "답변 대기", w: 2 });
  if ((DB.visitRequests || []).some(r => r.patientId === p.id && r.status === "pending")) flags.push({ cls: "tag-maintenance", label: "예약 변경 요청", w: 2 });
  if (p.nextVisit) { const dl = diffDays(t, p.nextVisit); if (dl >= 0 && dl <= 2) flags.push({ cls: "tag-maintenance", label: dl === 0 ? "오늘 내원" : `내원 D-${dl}`, w: 0 }); }
  return { flags, last, score: flags.reduce((a, f) => a + f.w, 0) };
}

}

/* ---------- 별 캔버스 ---------- */
let starGen = 0;
let starRebuild = null;
function initStars() {
  const gen = ++starGen;
  const canvas = $("#star-canvas"), hero = $("#night-hero");
  starRebuild = null;
  if (!canvas || !hero) return;
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], w = 0, h = 0;
  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = hero.clientWidth; h = hero.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((w * h) / 9000);
    stars = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h * 0.75, r: 0.3 + Math.random() * 1.3, a: 0.3 + Math.random() * 0.5, s: 0.5 + Math.random() * 1.5, p: Math.random() * Math.PI * 2 }));
  }
  function draw(time) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      const a = reduce ? s.a : Math.min(1, Math.max(0.15, s.a + Math.sin(time / 1000 * s.s + s.p) * 0.25));
      ctx.fillStyle = `rgba(234,231,246,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  build();
  starRebuild = () => { if (gen !== starGen) return; build(); if (reduce) draw(0); };
  if (reduce) { draw(0); return; }
  const loop = time => { if (gen !== starGen || !document.body.contains(canvas)) return; draw(time); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.addEventListener("resize", () => { if (starRebuild) starRebuild(); });

    const sb = e.target.closest("[data-sym]");

  </div>`;

const quizAnswers = {};
function bindDiagnosis() {
  Object.keys(quizAnswers).forEach(k => delete quizAnswers[k]);
  const root = $("#quiz-root");
  root.innerHTML = QUESTIONS.map((q, i) => `
    <div class="quiz-question">
      <span class="q-num">${pad(i + 1)} / ${pad(QUESTIONS.length)}</span>
      <h3>${q.text}</h3>
      <div class="quiz-options">${q.options.map((o, j) => `<label class="quiz-option"><input type="radio" name="q-${q.id}" value="${j}">${o.label}</label>`).join("")}</div>
    </div>`).join("") + `
    <div class="quiz-actions"><button type="button" class="btn btn-primary" id="quiz-submit">진단 결과 보기</button></div>
    <p class="quiz-hint" id="quiz-hint">모든 문항에 답하면 결과 보기 버튼이 활성화됩니다.</p>`;
  const prog = () => { $("#quiz-progress").textContent = `진행률 ${Object.keys(quizAnswers).length} / ${QUESTIONS.length}`; };
  prog();
  root.addEventListener("change", e => {
    const inp = e.target; if (inp.type !== "radio") return;
    const qid = inp.name.slice(2); quizAnswers[qid] = Number(inp.value);
    $$(`input[name="${inp.name}"]`).forEach(r => r.closest(".quiz-option").classList.toggle("checked", r.checked));
    prog();
  });
  $("#quiz-submit").addEventListener("click", () => {
    if (Object.keys(quizAnswers).length < QUESTIONS.length) {
      const h = $("#quiz-hint"); h.textContent = "아직 답하지 않은 문항이 있어요. 위로 스크롤해서 모두 답해주세요."; h.style.color = "var(--danger)"; return;
    }
    const type = computeResult(quizAnswers);
    Store.addAssessment({ patientId: myPid(), type, answers: QUESTIONS.map(q => quizAnswers[q.id]) });
    location.hash = "#/guide?type=" + type;
  });
}
function computeResult(ans) {
  const opt = id => { const q = QUESTIONS.find(x => x.id === id); return q.options[ans[id]]; };
  if (opt("impact").impact === "severe" || opt("duration").duration === "long") return "redflag";
  const score = { stress: 0, maintenance: 0, hygiene: 0 };
  QUESTIONS.forEach(q => { const w = q.options[ans[q.id]].weight || {}; Object.keys(w).forEach(k => { score[k] += w[k]; }); });
  let best = "stress";
  ["stress", "maintenance", "hygiene"].forEach(k => { if (score[k] > score[best]) best = k; });
  return score[best] === 0 ? "hygiene" : best;
}

function viewBreathing() {
  return `
  <div class="wrap-narrow" style="padding-top:48px;">

    <div id="breathing-root"></div>
    <div class="note" style="margin-top:32px;"><strong>근거</strong> — CBT-I의 이완요법(relaxation therapy) 요소 중 하나입니다. 스트레스성 불면 유형의 "오늘 밤 실천 가이드"에서도 안내하는 방법입니다.</div>
  </div>`;
}
const PHASES = [
  { text: "천천히 들이쉬세요", dur: 4, scale: 1.4 },
  { text: "멈추세요", dur: 7, scale: 1.4 },
  { text: "천천히 내쉬세요", dur: 8, scale: 1 }
];
const breath = { running: false, timer: null, tick: null, count: 0, voice: false, remain: 0 };
function speak(text) {
  if (!breath.voice || !("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 0.95;
    const v = window.speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith("ko")); if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function runPhase(i) {
  const c = $("#breathe-circle"); if (!c || !breath.running) return;
  const ph = PHASES[i];
  c.style.transitionDuration = ph.dur * 1000 + "ms";
  c.style.transform = `scale(${ph.scale})`;
  $("#breathe-phase").textContent = ph.text;
  breath.remain = ph.dur; $("#breathe-seconds").textContent = breath.remain + "초";
  speak(ph.text);
  clearInterval(breath.tick);
  breath.tick = setInterval(() => { breath.remain = Math.max(0, breath.remain - 1); const s = $("#breathe-seconds"); if (s) s.textContent = breath.remain + "초"; }, 1000);
  breath.timer = setTimeout(() => {
    if (i === 2) {
      breath.count++; const el = $("#breathe-count"); if (el) el.textContent = `완료한 호흡: ${breath.count}회`;
      const pid = myPid(); if (pid) { const l = Store.getLog(pid, todayStr()) || emptyLog(); Store.updateLog(pid, todayStr(), { breaths: (Number(l.breaths) || 0) + 1 }); }
    }
    runPhase((i + 1) % 3);
  }, ph.dur * 1000);
}
function stopBreathing() {
  breath.running = false; clearTimeout(breath.timer); clearInterval(breath.tick);
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}
  const c = $("#breathe-circle");
  if (c) { c.style.transitionDuration = "600ms"; c.style.transform = "scale(1)"; }
  const ph = $("#breathe-phase"); if (ph) ph.textContent = "시작 버튼을 눌러주세요";
  const s = $("#breathe-seconds"); if (s) s.innerHTML = "&nbsp;";
  const b = $("#breathe-toggle"); if (b) b.textContent = "시작하기";
}
function bindBreathing() {
  breath.count = 0;
  $("#breathing-root").innerHTML = `
    <div class="breathe-stage">
      <div class="breathe-ring"><div class="breathe-circle" id="breathe-circle"></div></div>
      <div class="breathe-phase" id="breathe-phase" aria-live="polite">시작 버튼을 눌러주세요</div>
      <div class="breathe-seconds" id="breathe-seconds">&nbsp;</div>
      <div class="breathe-count" id="breathe-count">완료한 호흡: 0회</div>
      <div class="breathe-controls">
        <button type="button" class="btn btn-primary" id="breathe-toggle">시작하기</button>
        <button type="button" class="btn btn-secondary" id="breathe-voice">${breath.voice ? "🔊 음성 안내 끄기" : "🔇 음성 안내 켜기"}</button>
      </div>
    </div>`;
  const vb = $("#breathe-voice");
  if (!("speechSynthesis" in window)) vb.hidden = true;
  else { try { window.speechSynthesis.getVoices(); } catch (e) {} }
  vb.addEventListener("click", () => {

  $("#breathe-toggle").addEventListener("click", e => {

/* ---------- 빗소리 · 백색소음 (Web Audio 합성) ---------- */
function viewSounds() {
  return `
  <div class="wrap-narrow" style="padding-top:48px;">
    <span class="hero-eyebrow">도구 · 사운드</span>
    <h1 style="font-size:26px;">빗소리 · 백색소음</h1>
    <p style="color:var(--ink-muted);">외부 음원이 아니라 브라우저에서 직접 합성한 소리입니다. 여러 개를 동시에 켜서 섞어도 좋아요.</p>
    <div id="sounds-root"></div>
    <div class="note" style="margin-top:24px;"><strong>안내</strong> — 볼륨은 기기 소리 크기와 함께 작동합니다. 이어폰 사용 시 너무 크지 않게 조절해 주세요.</div>
  </div>`;
}
const SOUND_DEFS = [{ id: "rain", name: "빗소리" }, { id: "white", name: "백색소음" }, { id: "wave", name: "파도소리" }];
let audioCtx = null; const sounds = {}; const soundVol = { rain: 60, white: 60, wave: 60 }; let autoStopTimer = null; let dropBuf = null;
function getCtx() {
  if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; audioCtx = new AC(); }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function noiseBuffer(c, sec) {
  const b = c.createBuffer(1, Math.floor(c.sampleRate * sec), c.sampleRate); const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function startSound(id) {
  const c = getCtx(); if (!c) return false;
  const gain = c.createGain(); gain.gain.value = soundVol[id] / 100; gain.connect(c.destination);
  const src = c.createBufferSource(); src.loop = true;
  const s = { gain, src, lfo: null, interval: null };
  if (id === "rain") {
    src.buffer = noiseBuffer(c, 4);
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1200; bp.Q.value = 0.6;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3500;
    src.connect(bp); bp.connect(lp); lp.connect(gain);
    if (!dropBuf) dropBuf = noiseBuffer(c, 0.06);
    s.interval = setInterval(() => {
      if (Math.random() >= 0.55) return;
      const t = c.currentTime;
      const ds = c.createBufferSource(); ds.buffer = dropBuf;
      const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2500;
      const g = c.createGain(); g.gain.setValueAtTime(0.2 + Math.random() * 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      ds.connect(hp); hp.connect(g); g.connect(gain); ds.start(t); ds.stop(t + 0.15);
    }, 180);
  } else if (id === "white") {
    src.buffer = noiseBuffer(c, 4);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 6000;
    src.connect(lp); lp.connect(gain);
  } else {
    src.buffer = noiseBuffer(c, 6);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
    const wg = c.createGain(); wg.gain.value = 0.7;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.12;
    const lfoGain = c.createGain(); lfoGain.gain.value = 0.3;
    lfo.connect(lfoGain); lfoGain.connect(wg.gain); lfo.start();
    src.connect(lp); lp.connect(wg); wg.connect(gain);
    s.lfo = lfo;
  }
  src.start(); sounds[id] = s; return true;
}
function stopSound(id) {
  const s = sounds[id]; if (!s) return;
  try { s.src.stop(); } catch (e) {}
  try { if (s.lfo) s.lfo.stop(); } catch (e) {}
  clearInterval(s.interval);
  try { s.gain.disconnect(); } catch (e) {}
  delete sounds[id];
}
function stopAllSounds() {
  Object.keys(sounds).forEach(stopSound);
  clearTimeout(autoStopTimer); autoStopTimer = null;
}
function resetSoundUI() {
  SOUND_DEFS.forEach(d => { const card = $("#sc-" + d.id); if (!card) return; card.classList.remove("playing"); const b = card.querySelector("[data-play]"); if (b) b.textContent = "재생"; });
  const sel = $("#sound-timer"); if (sel) sel.value = "0";
}
function bindSounds() {
  $("#sounds-root").innerHTML = `
    <div class="sound-timer-row"><label for="sound-timer">자동 정지</label>
      <select id="sound-timer"><option value="0">사용 안 함</option><option value="15">15분 후</option><option value="30">30분 후</option><option value="60">60분 후</option></select>
    </div>
    <div class="sound-grid">${SOUND_DEFS.map(d => `
      <div class="sound-card" id="sc-${d.id}">
        <div class="sound-card-top"><span>${d.name}</span><button type="button" class="btn btn-secondary btn-sm" data-play="${d.id}">재생</button></div>
        <input type="range" class="sound-volume" id="vol-${d.id}" min="0" max="100" value="${soundVol[d.id]}" data-vol="${d.id}" aria-label="${d.name} 볼륨">
      </div>`).join("")}</div>`;
  const root = $("#sounds-root");
  root.addEventListener("click", e => {
    const b = e.target.closest("[data-play]"); if (!b) return;
    const id = b.dataset.play; const card = $("#sc-" + id);
    if (sounds[id]) { stopSound(id); card.classList.remove("playing"); b.textContent = "재생"; }
    else if (startSound(id)) { card.classList.add("playing"); b.textContent = "정지"; }
  });
  root.addEventListener("input", e => {
    const id = e.target.dataset.vol; if (!id) return;
    soundVol[id] = Number(e.target.value);
    if (sounds[id]) sounds[id].gain.gain.value = soundVol[id] / 100;
  });
  $("#sound-timer").addEventListener("change", e => {
    clearTimeout(autoStopTimer); autoStopTimer = null;
    const m = Number(e.target.value);
    if (m > 0) autoStopTimer = setTimeout(() => { stopAllSounds(); resetSoundUI(); }, m * 60000);
  });
}

const notified = new Set();
function checkMedReminder() {
  const s = getSession(); if (!s || s.role !== "patient") return;
  const p = Store.patient(s.patientId); if (!p || !p.meds || !p.meds.enabled) return;
  const now = new Date(); const t = todayStr(); const nowM = now.getHours() * 60 + now.getMinutes();

function bindCaffeine() {

    const bed = toMin($("#cf-bed").value); const sens = Number($("#cf-sens").value);
    if (bed == null) { $("#cf-cutoff").innerHTML = "잠드는 시각을 입력해 주세요."; return; }
    const cut = bed - sens * 60;
    $("#cf-cutoff").innerHTML = `<span class="k">오늘 카페인 마지노선</span><strong>${ampm(minToHHMM(cut))}</strong><span class="today-meta">${ampm(minToHHMM(bed))}에 잠든다면 이 시각 이후로는 카페인을 피하세요.</span>`;

/* ---------- 4. 주간 리포트 ---------- */
function weekStats(pid, endDate) {
  const L = DB.logs[pid] || {}; const days = Array.from({ length: 7 }, (_, i) => addDays(endDate, -i));
  const logs = days.map(d => normalizeLog(L[d])).filter(hasContent);
  const ses = logs.map(sleepStats).filter(Boolean);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const num = k => logs.map(l => l[k]).filter(v => v !== "" && v != null && !isNaN(Number(v))).map(Number);
  const sym = {}; logs.forEach(l => l.symptoms.forEach(s => { sym[s] = (sym[s] || 0) + 1; }));
  return {
    days, n: logs.length,
    se: ses.length ? Math.round(avg(ses.map(s => s.se))) : null,
    tst: ses.length ? Math.round(avg(ses.map(s => s.tst))) : null,
    lat: num("latencyMin").length ? Math.round(avg(num("latencyMin"))) : null,
    wake: num("wakeCount").length ? Math.round(avg(num("wakeCount")) * 10) / 10 : null,
    mood: { good: logs.filter(l => l.mood === "good").length, ok: logs.filter(l => l.mood === "ok").length, bad: logs.filter(l => l.mood === "bad").length },
    herb: logs.length ? Math.round(logs.reduce((a, l) => a + (l.herb.am ? 1 : 0) + (l.herb.pm ? 1 : 0), 0) / (logs.length * 2) * 100) : null,
    check: logs.length ? Math.round(avg(logs.map(l => Object.values(l.checklist || {}).filter(Boolean).length)) * 10) / 10 : null,
    symptoms: Object.entries(sym).sort((a, b) => b[1] - a[1]).slice(0, 3)
  };
}
function deltaText(cur, prev, unit, betterUp) {
  if (cur == null || prev == null) return `<span class="delta">지난주 비교 없음</span>`;
  const d = Math.round((cur - prev) * 10) / 10;
  if (d === 0) return `<span class="delta">지난주와 같음</span>`;
  const good = betterUp ? d > 0 : d < 0;
  return `<span class="delta ${good ? "up" : "down"}">지난주보다 ${d > 0 ? "+" : ""}${d}${unit}</span>`;
}
function reportHTML(pid, viewer) {
  const p = Store.patient(pid); const t = todayStr();

  const tile = (k, v, unit, delta) => `<div class="stat"><span class="k">${k}</span><span class="v">${v != null ? v : "-"}<small>${v != null ? unit : ""}</small></span>${delta}</div>`;
  const summary = [];
  if (cur.se != null) summary.push(cur.se >= 85 ? `평균 수면효율 ${cur.se}%로 양호한 범위예요.` : `평균 수면효율은 ${cur.se}%로 양호 기준(85%)보다 낮아요.`);
  if (cur.lat != null && prev.lat != null && cur.lat < prev.lat) summary.push(`잠드는 데 걸린 시간이 지난주보다 ${prev.lat - cur.lat}분 줄었어요.`);

  return `
    <p class="today-meta" style="margin-bottom:14px;">${md(from)}(${dowOf(from)}) ~ ${md(t)}(${dowOf(t)}) · ${esc(p.name)}님</p>
    ${summary.length ? `<div class="note" style="margin-top:0;"><strong>이번 주 요약</strong> — ${summary.join(" ")}</div>` : ""}
    <div class="report-grid">

/* ---------- 원장: 14일 추이 차트 ---------- */
function trendChart(pid) {
  const t = todayStr(); const L = DB.logs[pid] || {};
  const dates = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
  const W = 640, x0 = 56, x1 = W - 20, yTop = 24, yBot = 150, lo = 50, hi = 100;
  const X = i => x0 + i * (x1 - x0) / 13;
  const Y = v => yTop + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (yBot - yTop);
  const pts = dates.map((d, i) => { const l = normalizeLog(L[d]); const st = sleepStats(l); return { d, i, l, se: st ? st.se : null }; });
  let path = "", pen = false;
  pts.forEach(p => { if (p.se == null) { pen = false; return; } path += `${pen ? "L" : "M"}${X(p.i).toFixed(1)} ${Y(p.se).toFixed(1)} `; pen = true; });
  const grid = [50, 70, 85, 100].map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${v === 85 ? "var(--moon)" : "var(--line)"}" stroke-width="1" ${v === 85 ? 'stroke-dasharray="4 4" opacity="0.6"' : ""}/><text x="${x0 - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--ink-faint)">${v}%</text>`).join("");
  const lastPt = [...pts].reverse().find(p => p.se != null);
  const dots = pts.filter(p => p.se != null).map(p => `<circle cx="${X(p.i)}" cy="${Y(p.se)}" r="${p === lastPt ? 5 : 3.5}" style="fill:${p === lastPt ? "var(--accent-strong)" : "var(--accent)"};stroke:var(--surface)" stroke-width="2"><title>${md(p.d)} 수면효율 ${p.se}%</title></circle>`).join("");
  const lastLabel = lastPt ? `<text x="${X(lastPt.i)}" y="${Y(lastPt.se) - 10}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--accent-strong)">${lastPt.se}%</text>` : "";
  const moodColor = { good: "var(--good)", ok: "var(--moon)", bad: "var(--danger)" };
  const moods = pts.map(p => { const m = p.l && p.l.mood; return `<rect x="${X(p.i) - 7}" y="166" width="14" height="14" rx="3" style="fill:${m ? moodColor[m] : "transparent"};stroke:${m ? "none" : "var(--line)"}" ${m ? 'fill-opacity="0.85"' : ""}><title>${md(p.d)} ${m ? MOOD_LABEL[m] : "기록 없음"}</title></rect>`; }).join("");
  const labels = pts.map(p => `<text x="${X(p.i)}" y="200" text-anchor="middle" font-size="10.5" style="fill:${p.d === t ? "var(--moon)" : "var(--ink-faint)"}">${md(p.d)}</text>`).join("");
  return `
  <div class="chart-wrap">
    <svg viewBox="0 0 ${W} 210" role="img" aria-label="최근 14일 수면효율과 기분 추이">
      ${grid}
      <text x="${x1}" y="${Y(85) - 6}" text-anchor="end" font-size="10.5" style="fill:var(--moon)">양호 기준 85%</text>
      <path d="${path}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${lastLabel}
      <text x="${x0 - 8}" y="177" text-anchor="end" font-size="11" style="fill:var(--ink-faint)">기분</text>
      ${moods}${labels}
    </svg>
    <div class="chart-legend"><span><i style="background:var(--accent)"></i>수면효율 (실제 수면 ÷ 침대에 있던 시간)</span><span><i style="background:var(--good)"></i>좋음</span><span><i style="background:var(--moon)"></i>보통</span><span><i style="background:var(--danger)"></i>나쁨</span></div>
  </div>`;
}

function viewPatientDetail(id) {
  const p = Store.patient(id);
  if (!p) return `<div class="wrap-narrow" style="padding-top:48px;"><div class="note"><strong>환자를 찾을 수 없어요.</strong> 목록에서 다시 선택해 주세요.</div><a href="#/admin" class="btn btn-primary" style="margin-top:16px;">환자 목록으로</a></div>`;
  const t = todayStr(); const L = DB.logs[id] || {};
  const msgs = Store.messages(id);
  const unreadIds = new Set(msgs.filter(m => m.from === "patient" && !m.readAt).map(m => m.id));
  Store.markRead(id, "patient");
  const { flags } = patientFlags(p);
  const last7 = Array.from({ length: 7 }, (_, i) => normalizeLog(L[addDays(t, -i)])).filter(hasContent);
  const se7 = avgSE(id, 7);
  const bad7 = last7.filter(l => l.mood === "bad").length;
  const herbRate = last7.length ? Math.round(last7.reduce((a, l) => a + (l.herb.am ? 1 : 0) + (l.herb.pm ? 1 : 0), 0) / (last7.length * 2) * 100) : null;
  if (composerState.pid !== id) { composerState.pid = id; composerState.date = ""; }

  const logRows = Array.from({ length: 14 }, (_, i) => addDays(t, -i)).map(d => {
    const l = normalizeLog(L[d]);
    if (!hasContent(l)) return `<div class="log-row missing">${md(d)} (${dowOf(d)}) · 기록 없음</div>`;
    const st = sleepStats(l); const facts = [];
    if (l.bedTime) facts.push(`취침 ${l.bedTime}`);
    if (l.wakeTime) facts.push(`기상 ${l.wakeTime}`);
    if (l.latencyMin !== "" && l.latencyMin != null) facts.push(`입면 ${l.latencyMin}분`);
    if (l.wakeCount !== "" && l.wakeCount != null) facts.push(`깸 ${l.wakeCount}회${l.wakeMin ? `(${l.wakeMin}분)` : ""}`);
    if (st) facts.push(`수면효율 ${st.se}%`);
    facts.push(herbText(l));
    const cl = Object.values(l.checklist || {}).filter(Boolean).length; if (cl) facts.push(`실천 ${cl}/${CHECKLIST_ITEMS.length}`);
    if (l.breaths) facts.push(`호흡 ${l.breaths}회`);
    const fbCount = DB.feedback.filter(f => f.patientId === id && f.from === "doctor" && f.date === d).length;
    return `<div class="log-row">
      <div class="log-row-head"><span><span class="d">${md(d)} (${dowOf(d)})</span> <span class="mood-pill ${l.mood || "none"}">${l.mood ? MOOD_LABEL[l.mood] : "기분 미입력"}</span>${fbCount ? ` <span class="tag tag-stress" style="margin:0;">피드백 ${fbCount}</span>` : ""}</span><button type="button" class="link-btn" data-fbdate="${d}">이 날짜에 피드백</button></div>
      <div class="facts">${facts.join(" · ")}</div>
      ${l.symptoms.length ? `<div class="facts">증상: ${l.symptoms.map(esc).join(", ")}</div>` : ""}
      ${l.memo && l.memo.trim() ? `<div class="memo">${esc(l.memo)}</div>` : ""}
    </div>`;
  }).join("");

  const asmt = Store.assessmentsOf(id);
  const asmtHTML = asmt.length ? `<div class="log-list">${asmt.map(a => { const g = GUIDES[a.type]; return `<div class="log-row"><div class="log-row-head"><span class="d">${fmtDT(a.createdAt)}</span><span class="tag ${g.tagClass}" style="margin:0;">${g.tagLabel}</span></div></div>`; }).join("")}</div>` : `<div class="empty">아직 자기점검 기록이 없어요.</div>`;

  const assigned = p.assignedTasks || [];
  const assignHTML = CHECKLIST_ITEMS.map(i => `<label class="assign-item"><input type="checkbox" data-assign="${i.id}" ${assigned.includes(i.id) ? "checked" : ""}><span>${i.label}</span></label>`).join("");

  const loggedDates = Array.from({ length: 14 }, (_, i) => addDays(t, -i)).filter(d => hasContent(normalizeLog(L[d])));
  const dateOpts = `<option value="">전체 (날짜 지정 없음)</option>` + loggedDates.map(d => `<option value="${d}" ${composerState.date === d ? "selected" : ""}>${md(d)} (${dowOf(d)}) 기록</option>`).join("");
  const thread = msgs.length ? msgs.map(m => msgHTML(m, "doctor", p.name, unreadIds.has(m.id))).join("") : `<div class="empty">아직 주고받은 메시지가 없어요.</div>`;

  return `
  <div class="wrap" style="padding-top:40px;">
    <a href="#/admin" class="back-link">‹ 환자 목록</a>
    <div class="detail-head">
      <div>
        <span class="hero-eyebrow" style="margin-bottom:10px;">환자 상세</span>
        <h1 style="font-size:26px; margin-bottom:4px;">${esc(p.name)}</h1>
        <p class="today-meta">${esc(p.note || "")}${p.note ? " · " : ""}초대코드 ${esc(p.code)} · 기록 시작 ${md(p.startDate)}</p>
      </div>
      <div class="field" style="width:180px;"><label for="next-visit">다음 내원일</label><input class="input" type="date" id="next-visit" value="${esc(p.nextVisit || "")}"></div>
    </div>
    <div class="flag-row" style="margin-bottom:8px;">${flags.length ? flags.map(f => `<span class="tag ${f.cls}">${f.label}</span>`).join("") : `<span class="tag tag-hygiene">특이사항 없음</span>`}</div>
    <div class="stat-row">
      <div class="stat"><span class="k">최근 7일 기록</span><span class="v">${last7.length}<small>/ 7일</small></span></div>
      <div class="stat"><span class="k">7일 평균 수면효율</span><span class="v">${se7 != null ? se7 : "-"}<small>${se7 != null ? "%" : ""}</small></span></div>
      <div class="stat ${bad7 >= 3 ? "warn" : ""}"><span class="k">7일 중 '나쁨'</span><span class="v">${bad7}<small>일</small></span></div>
      <div class="stat"><span class="k">한약 복용률</span><span class="v">${herbRate != null ? herbRate : "-"}<small>${herbRate != null ? "%" : ""}</small></span></div>
    </div>

    ${visitRequestBlock(id)}
    <div class="block">
      <div class="detail-head" style="margin-bottom:12px;"><h2 style="font-size:19px;margin:0;">최근 14일 추이</h2><a class="btn btn-secondary btn-sm" href="#/admin/patient/${esc(id)}/report">주간 리포트 보기</a></div>
      ${trendChart(id)}
    </div>

    <div class="block" id="feedback-block">
      <h2>피드백</h2>
      <p class="block-desc">생활 지도와 격려 위주로 남겨주세요. 처방 변경은 내원 진료에서 안내합니다.</p>
      <div class="thread">${thread}</div>
      <form id="fb-form" novalidate>
        <div class="composer-top"><label for="fb-date">대상</label><select id="fb-date">${dateOpts}</select></div>
        <div class="tpl-chips" aria-label="자주 쓰는 문장">${Store.templates().map(tp => `<button type="button" class="toggle-chip" data-tpl="${esc(tp.id)}">${esc(tp.text)}</button>`).join("")}</div>
        <textarea class="input" id="fb-text" placeholder="환자에게 보낼 피드백을 적어주세요"></textarea>
        <div class="composer-row"><a href="#/admin/templates" class="link-btn" style="text-decoration:none;">자주 쓰는 문장 관리</a><button class="btn btn-primary btn-sm" type="submit">피드백 보내기</button></div>
        <div class="err" id="fb-err" role="alert"></div>
      </form>
    </div>

    <div class="block">
      <h2>기록 (최근 14일)</h2>

    </div>

    <div class="block">
      <h2>실천 과제 지정</h2>
      <p class="block-desc">체크한 항목은 환자 체크리스트 맨 위에 '원장님 권장'으로 표시돼요.</p>
      <div class="assign-list" id="assign-list">${assignHTML}</div>
      <div class="ok-msg" id="assign-msg"></div>
    </div>

    <div class="block">
      <h2>자기점검 이력</h2>
      ${asmtHTML}

function bindPatientDetail(id) {
  const p = Store.patient(id); if (!p) return;

  $("#next-visit").addEventListener("change", e => { Store.updatePatient(id, { nextVisit: e.target.value }); });
  $("#fb-date").addEventListener("change", e => { composerState.date = e.target.value; });
  $$("[data-tpl]").forEach(b => b.addEventListener("click", () => {
    const tp = Store.templates().find(x => x.id === b.dataset.tpl); if (!tp) return;
    const ta = $("#fb-text"); ta.value = ta.value.trim() ? ta.value.trim() + " " + tp.text : tp.text; ta.focus();
  }));
  $$("[data-fbdate]").forEach(b => b.addEventListener("click", () => {
    composerState.date = b.dataset.fbdate; const sel = $("#fb-date"); sel.value = composerState.date;
    $("#feedback-block").scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(() => $("#fb-text").focus({ preventScroll: true }), 300);
  }));
  $("#fb-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#fb-text").value.trim();
    if (!v) { $("#fb-err").textContent = "보낼 피드백을 적어주세요."; return; }
    Store.addMessage({ patientId: id, from: "doctor", text: v, date: $("#fb-date").value || null });

    Store.updatePatient(id, { assignedTasks: CHECKLIST_ITEMS.map(i => i.id).filter(x => cur.has(x)) });

  });
}

function viewTemplates() {
  const tps = Store.templates();
  return `
  <div class="wrap-narrow" style="padding-top:48px;">
    <span class="hero-eyebrow">원장 모드</span>
    <h1 style="font-size:26px;">자주 쓰는 피드백 문장</h1>
    <p style="color:var(--ink-muted);">환자 상세 화면에서 한 번에 불러올 수 있는 문장이에요.</p>
    <div class="log-list" id="tpl-list">${tps.length ? tps.map(tp => `<div class="tpl-row"><p>${esc(tp.text)}</p><button type="button" class="link-btn" data-del="${esc(tp.id)}">삭제</button></div>`).join("") : `<div class="empty">저장된 문장이 없어요.</div>`}</div>
    <form id="tpl-form" style="margin-top:20px;" novalidate>
      <label class="sub-label" for="tpl-text">새 문장 추가</label>
      <textarea class="input" id="tpl-text" placeholder="예: 잠들기 전 호흡 연습을 이어가 보세요."></textarea>
      <div class="composer-row"><span></span><button class="btn btn-primary btn-sm" type="submit">추가하기</button></div>
      <div class="err" id="tpl-err" role="alert"></div>
    </form>
  </div>`;
}
function bindTemplates() {
  $("#tpl-list").addEventListener("click", e => { const b = e.target.closest("[data-del]"); if (!b) return; Store.removeTemplate(b.dataset.del); render(); });
  $("#tpl-form").addEventListener("submit", e => {
    e.preventDefault(); const v = $("#tpl-text").value.trim();
    if (!v) { $("#tpl-err").textContent = "추가할 문장을 적어주세요."; return; }
    Store.addTemplate(v); render();
  });
}

/* ---------- 내비 ---------- */
function renderNav(activeKey) {
  const s = getSession(); const nav = $(".site-nav"); let items;
  if (!s) items = [["#/login", "login", "시작하기"], ["#/library", "library", "라이브러리"], ["#/about", "about", "서비스 소개"]];
  else if (s.role === "doctor") {
    const waiting = DB.patients.filter(p => { const lm = Store.messages(p.id).at(-1); return lm && lm.from === "patient"; }).length;
    items = [["#/admin", "admin", "환자 목록" + (waiting ? `<span class="nav-badge">${waiting}</span>` : "")], ["#/admin/templates", "templates", "피드백 문장"], ["#/library", "library", "라이브러리"], ["#/about", "about", "서비스 소개"]];
  } else {
    const n = Store.unread(s.patientId, "doctor");
    items = [["#/", "home", "홈"], ["#/log", "log", "기록"], ["#/feedback", "feedback", "피드백" + (n ? `<span class="nav-badge">${n}</span>` : "")], ["#/tools", "tools", "도구"], ["#/library", "library", "라이브러리"]];
  }
  nav.innerHTML = items.map(([h, k, l]) => `<a href="${h}" data-route="${k}" class="${k === activeKey ? "active" : ""}">${l}</a>`).join("")
    + (s ? `<button type="button" class="nav-logout" id="logout-btn">${s.role === "doctor" ? "원장" : esc((Store.patient(s.patientId) || {}).name || "환자")} · 나가기</button>` : "");
  const lo = $("#logout-btn");
  if (lo) lo.addEventListener("click", () => { setSession(null); location.hash = "#/login"; });
}

/* ---------- 라우터 ---------- */
function parseHash() {
  const h = location.hash.slice(1) || "/";
  const qi = h.indexOf("?");
  return { path: (qi >= 0 ? h.slice(0, qi) : h) || "/", params: new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : "") };
}
let currentPath = null;
function render() {
  const { path, params } = parseHash();
  let s = getSession();
  if (s && s.role === "patient" && !Store.patient(s.patientId)) { setSession(null); s = null; }
  const isPublic = path === "/login" || path === "/library" || path.startsWith("/about") || path.startsWith("/article/");
  const go = h => { if (location.hash !== h) { location.replace(h); } return true; };
  if (!s && !isPublic && go("#/login")) return;
  if (s && path === "/login" && go(s.role === "doctor" ? "#/admin" : "#/")) return;
  if (s && s.role === "doctor" && !isPublic && !path.startsWith("/admin") && go("#/admin")) return;
  if (s && s.role === "patient" && path.startsWith("/admin") && go("#/")) return;

  if (path !== "/breathing") stopBreathing();
  if (path !== "/sounds") stopAllSounds();
  currentPath = path;

  const app = $("#app"); let key = "", after = null, html = "";
  let m;
  if (path === "/login") { key = "login"; html = viewLogin(); after = bindLogin; }
  else if (path === "/") { key = "home"; html = viewHome(); after = initStars; }
  else if (path === "/log") { key = "log"; html = viewLog(params); after = bindLog; }
  else if (path === "/feedback") { key = "feedback"; html = viewFeedback(); after = bindFeedback; }
  else if (path === "/diagnosis") { key = "home"; html = viewDiagnosis(); after = bindDiagnosis; }
  else if (path === "/guide") { key = "home"; html = viewGuide(); after = () => bindGuide(params.get("type")); }
  else if (path === "/tools") { key = "tools"; html = viewTools(); after = bindTools; }
  else if (path === "/breathing") { key = "tools"; html = viewBreathing(); after = bindBreathing; }
  else if (path === "/sounds") { key = "tools"; html = viewSounds(); after = bindSounds; }
  else if (path === "/meds") { key = "tools"; html = viewMeds(); after = bindMeds; }
  else if (path === "/visit") { key = "tools"; html = viewVisit(); after = bindVisit; }
  else if (path === "/caffeine") { key = "tools"; html = viewCaffeine(); after = bindCaffeine; }
  else if (path === "/report") { key = "tools"; html = viewReport(); }
  else if (path === "/library") { key = "library"; html = viewLibrary(); after = bindLibrary; }
  else if ((m = path.match(/^\/article\/(.+)$/))) { key = "library"; html = viewArticle(decodeURIComponent(m[1])); }
  else if (path === "/about" || path === "/about/terms" || path === "/about/privacy") {
    key = "about"; html = viewAbout();
    const anchor = path === "/about/terms" ? "terms" : path === "/about/privacy" ? "privacy" : null;
    if (anchor) after = () => setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
  }
  else if (path === "/admin") { key = "admin"; html = viewAdmin(); after = bindAdmin; }
  else if (path === "/admin/templates") { key = "templates"; html = viewTemplates(); after = bindTemplates; }
  else if ((m = path.match(/^\/admin\/patient\/(.+)\/report$/))) { key = "admin"; html = viewAdminReport(decodeURIComponent(m[1])); }
  else if ((m = path.match(/^\/admin\/patient\/(.+)$/))) { key = "admin"; const id = decodeURIComponent(m[1]); html = viewPatientDetail(id); after = () => bindPatientDetail(id); }
  else { location.replace(s ? (s.role === "doctor" ? "#/admin" : "#/") : "#/login"); return; }

  app.innerHTML = html;
  renderNav(key);
  if (after) after();
  checkMedReminder();
  if (!s || s.role !== "patient") hideToast();
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

/* 다른 탭(예: 원장 탭)에서 저장하면 이 탭에도 반영 */
window.addEventListener("storage", e => {
  if (e.key !== STORE_KEY) return;
  loadDB();
  const { path } = parseHash();
  const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && $("#app").contains(document.activeElement);
  if (path === "/breathing" || path === "/sounds") { renderNav(path === "/breathing" || path === "/sounds" ? "tools" : ""); return; }
  if (path === "/log") { renderCal(); if (!typing) renderEditor(); const key = "log"; renderNav(key); return; }
  if (typing) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
});

loadDB();
render();

</script>
</body>
</html>
